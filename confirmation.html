<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réservation Confirmée</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f0f10;
      --card: #171718;
      --gold: #d4af37;
      --gold-soft: #b8922f;
      --text: #f5f2ea;
      --muted: #a9a18f;
      --border: rgba(212,175,55,.25);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(212,175,55,.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(212,175,55,.08), transparent 40%),
        var(--bg);

      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    /* Contour décoratif */
    body::before {
      content: '';
      position: fixed;
      inset: 20px;
      border: 1px solid rgba(212,175,55,.18);
      pointer-events: none;
    }

    /* Carte */
    .card {
      background: linear-gradient(145deg, #1a1a1c, #111112);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 560px;
      padding: 3rem 3.5rem;
      border-radius: 10px;

      box-shadow:
        0 0 0 1px rgba(212,175,55,.05),
        0 15px 40px rgba(0,0,0,.6);

      position: relative;
      overflow: hidden;

      animation: rise .6s ease both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 40px;
      right: 40px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Icône */
    .check-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;

      background: linear-gradient(145deg, var(--gold), var(--gold-soft));

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 1.8rem;

      box-shadow:
        0 8px 24px rgba(212,175,55,.35);

      animation: pop .5s .3s both;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.6);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .check-wrap svg {
      stroke: #111;
    }

    /* Titres */
    .tag {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: .72rem;
      color: var(--gold);
      margin-bottom: .6rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 2rem;
      color: #fff;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(212,175,55,.15);
      margin-bottom: 2rem;
    }

    /* Détails */
    .details {
      display: grid;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .detail-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;

      border-radius: 8px;

      background: rgba(212,175,55,.08);
      border: 1px solid rgba(212,175,55,.12);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-icon svg {
      stroke: var(--gold);
    }

    .detail-text label {
      display: block;
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .2rem;
    }

    .detail-text strong {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
    }

    /* Boutons */
    .actions {
      display: flex;
      gap: .8rem;
      margin-top: 2rem;
    }

    .btn {
      flex: 1;
      padding: .95rem 1rem;
      border-radius: 6px;

      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 500;

      cursor: pointer;
      transition: .2s ease;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(212,175,55,.35);
      color: var(--gold);
    }

    .btn-outline:hover {
      background: rgba(212,175,55,.08);
      transform: translateY(-1px);
    }

    @media (max-width: 480px) {
      .card {
        padding: 2.2rem 1.5rem;
      }

      .actions {
        flex-direction: column;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Icône -->
    <div class="check-wrap">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <p class="tag">Réservation confirmée</p>

    <h1>Votre salle est réservée !</h1>

    <hr class="divider" />

    <!-- Détails -->
    <div class="details">

      <div class="detail-row">
        <div class="detail-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
        </div>

        <div class="detail-text">
          <label>Salle</label>
          <strong>Salle Confluence — 3ème étage</strong>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>

        <div class="detail-text">
          <label>Date</label>
          <strong>Lundi 13 mai 2026</strong>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>

        <div class="detail-text">
          <label>Horaires</label>
          <strong>09h00 – 11h30</strong>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
          </svg>
        </div>

        <div class="detail-text">
          <label>Participants</label>
          <strong>8 personnes</strong>
        </div>
      </div>

    </div>

    <!-- Bouton -->
    <div class="actions">
      <button class="btn btn-outline" onclick="window.location.href='index.html'">
        Retour à l'accueil
      </button>
    </div>

  </div>

</body>
</html>
