<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réservation Confirmée</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  
</head>

<body>

  <div class="card">

    <!-- Icône -->
    <div class="check-wrap">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <p class="tag">Réservation confirmée</p>

    <h1>Votre salle est réservée !</h1>

    <hr class="divider" />

    <!-- Détails -->
    <div class="details">

      <div class="detail-row">
        <div class="detail-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
        </div>

        <div class="detail-text">
          <label>Salle</label>
          <strong>Salle Confluence — 3ème étage</strong>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>

        <div class="detail-text">
          <label>Date</label>
          <strong>Lundi 13 mai 2026</strong>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>

        <div class="detail-text">
          <label>Horaires</label>
          <strong>09h00 – 11h30</strong>
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
          </svg>
        </div>

        <div class="detail-text">
          <label>Participants</label>
          <strong>8 personnes</strong>
        </div>
      </div>

    </div>

    <!-- Bouton -->
    <div class="actions">
      <button class="btn btn-outline" onclick="window.location.href='index.html'">
        Retour à l'accueil
      </button>
    </div>

  </div>

</body>
</html>
